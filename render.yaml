services:
  - type: web
    name: seguridad-informatica-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health

  - type: web
    name: seguridad-informatica-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://seguridad-informatica-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
